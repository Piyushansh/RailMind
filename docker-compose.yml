version: "3.9"

services:
  postgres:
    # pgvector/pgvector ships the pgvector extension pre-built on top of the official
    # postgres image - required by V8__policy_rag.sql's `CREATE EXTENSION vector`.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: railmind
      POSTGRES_USER: railmind
      POSTGRES_PASSWORD: railmind
    ports:
      - "5432:5432"
    volumes:
      - railmind_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railmind"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis: used for caching (station search, train details) and distributed login lockout.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Kafka in KRaft mode (no Zookeeper needed) - single node, fine for local/demo use.
  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/railmind
      DB_USERNAME: railmind
      DB_PASSWORD: railmind
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-dev-only-change-me-32bytes-min}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      RAG_EMBEDDING_PROVIDER: ${RAG_EMBEDDING_PROVIDER:-hashing}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      SEAT_HOLD_MINUTES: ${SEAT_HOLD_MINUTES:-15}
      HOLD_EXPIRY_SWEEP_INTERVAL_MS: ${HOLD_EXPIRY_SWEEP_INTERVAL_MS:-60000}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

  # Scrapes the backend's /actuator/prometheus endpoint (exposed via
  # micrometer-registry-prometheus - see pom.xml and application.yml's
  # management.endpoints.web.exposure.include).
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./infrastructure/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - railmind_grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  railmind_pg_data:
  railmind_grafana_data:
